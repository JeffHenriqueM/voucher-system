<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Luxo -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Voucher Ticket Shape com Sombra -->
  <g filter="url(#glow)">
    <!-- Ticket com recorte semicircular clássico de picote nas duas laterais -->
    <path d="M 10 21 
             C 10 17.5 12.8 15 16 15 
             L 48 15 
             C 51.2 15 54 17.5 54 21 
             L 54 26.5 
             C 51.2 26.5 49 28.7 49 31.5 
             C 49 34.3 51.2 36.5 54 36.5 
             L 54 42 
             C 54 45.5 51.2 48 48 48 
             L 16 48 
             C 12.8 48 10 45.5 10 42 
             L 10 36.5 
             C 12.8 36.5 15 34.3 15 31.5 
             C 15 28.7 12.8 26.5 10 26.5 
             Z" 
          fill="url(#ticketGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="1.8"/>

    <!-- Linha pontilhada / picote entre canhoto e corpo do voucher -->
    <line x1="24" y1="16.5" x2="24" y2="46.5" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2.5 2" stroke-linecap="round" opacity="0.9"/>

    <!-- Canhoto: Estrela Dourada de Luxo -->
    <path d="M 17 24.5 L 18.7 28.8 L 23.3 29.1 L 19.8 32.1 L 20.8 36.6 L 17 34.2 L 13.2 36.6 L 14.2 32.1 L 10.7 29.1 L 15.3 28.8 Z" fill="url(#goldGrad)"/>

    <!-- Corpo: Barra de Título VOUCHER -->
    <rect x="28" y="20.5" width="18" height="3.5" rx="1.75" fill="url(#goldGrad)"/>

    <!-- Linhas de Texto do Cupom -->
    <rect x="28" y="27" width="19" height="2.2" rx="1.1" fill="#e2e8f0" opacity="0.9"/>
    <rect x="28" y="31.5" width="13" height="2" rx="1" fill="#94a3b8" opacity="0.8"/>

    <!-- Código de Barras / Serial do Voucher -->
    <g fill="url(#goldGrad)" opacity="0.95">
      <rect x="28" y="36.5" width="1.6" height="5.5" rx="0.8"/>
      <rect x="30.8" y="36.5" width="2.6" height="5.5" rx="0.8"/>
      <rect x="34.6" y="36.5" width="1.2" height="5.5" rx="0.6"/>
      <rect x="37" y="36.5" width="2.2" height="5.5" rx="0.8"/>
      <rect x="40.4" y="36.5" width="3.2" height="5.5" rx="0.8"/>
      <rect x="44.8" y="36.5" width="1.6" height="5.5" rx="0.8"/>
      <rect x="47.6" y="36.5" width="2.4" height="5.5" rx="0.8"/>
    </g>
  </g>
</svg>