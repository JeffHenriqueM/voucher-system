<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Villamor Vouchers</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261022_09" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=20261022_09" />
  <link rel="shortcut icon" href="favicon.ico?v=20261022_09" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261022_09" />
  <style>
    /* ── Reset ───────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      background: #e5e7eb;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* ── Barra de ações (não imprime) ─────────── */
    .actions-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }

    .btn-print {
      background: #1d4ed8;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-print:hover { background: #1e40af; }

    .btn-uso {
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid;
    }
    .btn-uso.marcar   { background: #dc2626; color:#fff; border-color:#dc2626; }
    .btn-uso.desmarcar{ background: transparent; color:#374151; border-color:#d1d5db; }
    .btn-uso:disabled { opacity: .6; cursor: not-allowed; }

    .badge-status {
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
    }
    .badge-ok   { background:#dcfce7; color:#15803d; }
    .badge-used { background:#fee2e2; color:#dc2626; }

    /* ── Voucher (papel) ─────────────────────── */
    .voucher {
      background: #fff;
      width: 100%;
      max-width: 680px;
      border: 1px solid #ccc;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
    }

    /* ── Cabeçalho ───────────────────────────── */
    .v-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #111;
      padding: 12px 16px;
      gap: 12px;
    }

    .v-title {
      text-align: left;
    }

    .v-title h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #111;
      margin-bottom: 2px;
    }

    .v-title h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #475569;
    }

    .v-numero-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .v-numero-label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: .1em;
      border: 1px solid #111;
      padding: 2px 8px;
      font-weight: 700;
    }

    #qrcode {
      width: 80px;
      height: 80px;
    }
    #qrcode canvas, #qrcode img { width: 80px !important; height: 80px !important; }

    .v-numero-val {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .1em;
    }

    /* ── Corpo de dados ──────────────────────── */
    .v-dados {
      border-bottom: 1px solid #111;
      padding: 10px 14px;
    }

    .v-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      margin-bottom: 4px;
      line-height: 1.5;
    }

    .v-label {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
    }

    .v-value {
      font-size: 11px;
      text-transform: uppercase;
    }

    .v-validade {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ── Especificação ───────────────────────── */
    .v-espec-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 14px 2px;
      border-bottom: 1px solid #ddd;
    }

    .v-espec-texto {
      font-size: 10.5px;
      padding: 6px 14px 10px;
      line-height: 1.6;
      border-bottom: 1px solid #111;
    }

    /* ── Especificações de uso ───────────────── */
    .v-uso-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 8px 14px 4px;
    }

    .v-uso-lista {
      padding: 0 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .v-uso-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 10.5px;
      line-height: 1.5;
    }

    .v-checkbox {
      width: 11px;
      height: 11px;
      border: 1px solid #333;
      flex-shrink: 0;
      margin-top: 2px;
      display: inline-block;
    }

    /* ── Rodapé / Assinatura ─────────────────── */
    .v-footer {
      border-top: 1px solid #111;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    .v-assinatura {
      padding: 16px 14px 10px;
      border-right: 1px solid #111;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .v-assinatura-linha {
      width: 180px;
      border-bottom: 1px solid #333;
      margin-bottom: 4px;
      height: 44px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2px;
      position: relative;
    }

    .v-assinatura-img {
      max-height: 46px;
      max-width: 160px;
      object-fit: contain;
      position: absolute;
      bottom: 2px;
    }

    .v-assinatura-cargo {
      font-size: 10px;
      text-align: center;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* Estilos do Histórico de Estadias no Voucher */
    .v-historico-box {
      border-bottom: 1px solid #111;
      padding: 6px 14px 8px;
      background: #fafafa;
    }
    .v-historico-title {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 4px;
    }
    .v-historico-row {
      font-size: 9.5px;
      color: #333;
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px dashed #e2e8f0;
    }
    .v-historico-row:last-child { border-bottom: none; }


    @media (max-width: 600px) {
      body {
        padding: 12px 8px 32px;
      }
      .actions-bar {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        max-width: 680px;
        gap: 8px;
      }
      .actions-bar > div {
        flex-direction: column;
        width: 100%;
      }
      .actions-bar button, .btn-print {
        width: 100%;
        justify-content: center;
      }
      .voucher {
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
      }
      .v-header {
        padding: 10px 12px;
      }
      .v-title h1 {
        font-size: 18px;
      }
      .v-title h2 {
        font-size: 11px;
      }
      #qrcode {
        width: 64px;
        height: 64px;
      }
      #qrcode canvas, #qrcode img {
        width: 64px !important;
        height: 64px !important;
      }
      .v-numero-val {
        font-size: 14px;
      }
      .v-row {
        grid-template-columns: 115px 1fr;
        font-size: 10.5px;
        line-height: 1.45;
      }
      .v-label {
        font-size: 10px;
      }
      .v-value {
        font-size: 10px;
      }
      .v-espec-texto {
        font-size: 10px;
        line-height: 1.5;
        padding: 6px 12px 10px;
      }
      .v-uso-item {
        font-size: 9.5px;
      }

      .v-rodape {
        flex-direction: column;
        gap: 16px;
        padding: 12px 14px;
      }
      .v-assinatura-col {
        width: 100%;
      }
    }

    .v-data-impressao {
      padding: 16px 14px 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      font-size: 9px;
      color: #555;
    }

    /* ── USADO watermark ─────────────────────── */
    .v-usado-stamp {
      display: none;
    }

    .voucher.is-usado .v-usado-stamp,
    .voucher.is-cancelado .v-usado-stamp {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 74px;
      font-weight: 900;
      color: rgba(220, 38, 38, 0.22);
      text-transform: uppercase;
      letter-spacing: .2em;
      pointer-events: none;
      white-space: nowrap;
    }

    .voucher { position: relative; overflow: hidden; }

    /* ── Loading / Erro ──────────────────────── */
    .state-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }
    .state-wrap h2 { margin: 1rem 0 .5rem; font-size: 1.1rem; }
    .state-wrap p  { color: #6b7280; font-size: .9rem; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: #1d4ed8;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ───────────────────────────────── */
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      padding: .7rem 1.2rem; border-radius: 8px;
      background: #111; color: #fff;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 12px rgba(0,0,0,.2); z-index: 999;
    }
    .toast.hidden { display: none; }
    .toast.toast-error   { background: #dc2626; }
    .toast.toast-success { background: #16a34a; }

    /* ── Print ───────────────────────────────── */
    @media print {
      body { background: #fff; padding: 0; }
      .actions-bar { display: none !important; }
      .voucher { box-shadow: none; border: 1px solid #ccc; max-width: 100%; }
    }
  </style>
</head>

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const codigo = params.get('v');

    // ── Helpers ──────────────────────────────────────────────
    function showToast(msg, tipo = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast toast-${tipo}`;
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.add('hidden'), 3500);
    }

    function fmt(val) {
      return Number(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function fmtDateTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function fmtDate(dateStr) {
      if (!dateStr) return '—';
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    }

    function escHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Especificações de uso ─────────────────────────────────
    function renderEspecUso(texto) {
      if (!texto || !texto.trim()) {
        return '<div class="v-uso-item"><span class="v-checkbox"></span><span>Nenhuma especificação cadastrada.</span></div>';
      }
      return texto.split('\n')
        .map(linha => linha.trim())
        .filter(linha => linha.length > 0)
        .map(linha => `<div class="v-uso-item"><span class="v-checkbox"></span><span>${escHtml(linha)}</span></div>`)
        .join('');
    }

    // ── Histórico de estadias ─────────────────────────────────
    function renderHistoricoEstadias(lista) {
      if (!lista || !lista.length) return '';
      const rows = lista.map((h, i) => `
        <div class="v-historico-row">
          <span><strong>Estadia ${i+1}:</strong> ${h.diarias_utilizadas} diária(s) — Check-in: ${fmtDate(h.data_checkin)} a Check-out: ${fmtDate(h.data_checkout)}</span>
          <span style="color:#64748b;">${escHtml(h.observacoes || '')}</span>
        </div>
      `).join('');

      return `
        <div class="v-historico-box">
          <div class="v-historico-title">HISTÓRICO DE UTILIZAÇÃO DAS DIÁRIAS :</div>
          ${rows}
        </div>
      `;
    }

    // ── Carregar ─────────────────────────────────────────────
    async function carregarVoucher() {
      if (!codigo) {
        renderErro('Link inválido', 'Nenhum código de voucher encontrado na URL.');
        return;
      }

      const { data, error } = await db
        .from('vouchers')
        .select('*')
        .eq('codigo', codigo)
        .single();

      if (error || !data) {
        renderErro('Voucher não encontrado', 'O link pode estar incorreto ou o voucher foi removido.');
        return;
      }

      // Buscar solicitação de origem (se houver sido solicitado por Reservas)
      let solicitacaoOrigem = null;
      try {
        const { data: sol } = await db
          .from('voucher_solicitacoes')
          .select('*')
          .eq('voucher_codigo', codigo)
          .maybeSingle();
        if (sol) solicitacaoOrigem = sol;
      } catch (e) {}

      // Buscar histórico de utilizações / estadias
      let historicoEstadias = [];
      try {
        const { data: hist } = await db
          .from('voucher_historico_uso')
          .select('*')
          .eq('voucher_codigo', codigo)
          .order('created_at', { ascending: true });
        if (hist) historicoEstadias = hist;
      } catch (e) {}

      // Assinatura oficial SOMENTE se já estiver assinado pelo Administrador
      let assinaturaUrl = '';
      const isAssinado = (data.status_fluxo === 'ativo' || data.status_fluxo === 'usado') && Boolean(data.assinado_em);

      if (isAssinado) {
        assinaturaUrl = data.assinatura_url || '';
        if (!assinaturaUrl) {
          try {
            const { data: cfg } = await db.from('configuracoes_sistema').select('valor').eq('chave', 'assinatura_oficial').single();
            if (cfg && cfg.valor && cfg.valor.url) assinaturaUrl = cfg.valor.url;
          } catch (e) {}
        }
      }

      renderVoucher(data, historicoEstadias, assinaturaUrl, solicitacaoOrigem);
    }

    // ── Render Erro ──────────────────────────────────────────
    function renderErro(titulo, msg) {
      document.getElementById('root').innerHTML = `
        <div class="state-wrap">
          <div style="font-size:3rem">❌</div>
          <h2>${titulo}</h2>
          <p>${msg}</p>
          <a href="index.html" style="display:inline-block;margin-top:1rem;color:#1d4ed8;font-size:13px;">← Voltar ao painel</a>
        </div>`;
    }

    // ── Render Voucher ───────────────────────────────────────
    function renderVoucher(v, historicoEstadias = [], assinaturaUrl = '', solicitacaoOrigem = null) {
      document.title = `Voucher ${v.numero || v.codigo} — ${v.nome_socio}`;
      const tot = v.diarias_totais || v.diarias || 2;
      const usd = v.diarias_usadas || (v.usado ? tot : 0);
      const saldo = Math.max(0, tot - usd);

      function extrairDadosCancelamento(item) {
        if (!item) return null;
        const isCanc = Boolean(item.cancelado || item.status_fluxo === 'cancelado');
        if (!isCanc && !item.motivo_cancelamento) return null;
        let motivo = item.motivo_cancelamento || '';
        let por = item.cancelado_por || '';
        let data = item.cancelado_em || '';
        if ((!motivo || !por || !data) && item.observacoes) {
          const match = String(item.observacoes).match(/\[CANCELADO\s*(?:em\s*([^.]+?))?\s*(?:por\s*([^.]+?))?\.\s*Motivo:\s*([^\]]+)\]/i);
          if (match) {
            if (!data) data = match[1] || '';
            if (!por) por = match[2] || '';
            if (!motivo) motivo = match[3] || '';
          } else {
            const matchSimples = String(item.observacoes).match(/\[CANCELADO:\s*([^\]]+)\]/i);
            if (matchSimples && !motivo) motivo = matchSimples[1];
          }
        }
        return {
          isCancelado: true,
          motivo: (motivo || 'Voucher cancelado pela administração.').trim(),
          por: (por || item.pos_venda_nome || 'Administração').trim(),
          data: (data || item.updated_at || item.created_at || '').trim()
        };
      }

      const dadosCancelamento = extrairDadosCancelamento(v);
      const isCancelado = Boolean(dadosCancelamento || v.cancelado || v.status_fluxo === 'cancelado');
      const isUsadoTotal = Boolean(v.usado || saldo === 0);
      const isAssinado = (v.status_fluxo === 'ativo' || v.status_fluxo === 'usado') && Boolean(v.assinado_em);
      const isMinuta = !isCancelado && (v.status_fluxo === 'aguardando_assinatura' || !isAssinado);
      const hojeStr = new Date().toISOString().split('T')[0];
      // Se já foi dado baixa (usado), ele NÃO é considerado vencido
      const isVencido = !isCancelado && !isUsadoTotal && v.validade ? (v.validade < hojeStr) : false;
      const disponivel = !isCancelado && !isUsadoTotal && isAssinado && !isVencido;
      const linkAtual = window.location.href;

      const espec = `Voucher de ${v.diarias > 1 ? v.diarias + ' ('+numPorExtenso(v.diarias)+')' : 'uma (01)'} diária${v.diarias > 1 ? 's' : ''} anua${v.diarias > 1 ? 'is' : 'l'} para um casal no Hotel Villamor Prime.`;

      const brinde = v.brinde_descricao
        ? escHtml(v.brinde_descricao).toUpperCase()
        : `0${v.diarias} DIARIA${v.diarias > 1 ? 'S' : ''} ANUAIS`;

      const agora = new Date().toLocaleString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });

      // Dados de Solicitação
      const temSolicitacao = Boolean(solicitacaoOrigem || v.solicitante_nome);
      const quemSolicitou = v.solicitante_nome || (solicitacaoOrigem ? (solicitacaoOrigem.solicitante_nome || solicitacaoOrigem.solicitante) : 'Equipe de Reservas');
      const quandoSolicitou = (solicitacaoOrigem && solicitacaoOrigem.created_at) || v.solicitado_em || null;
      const periodoPretendido = (v.periodo_checkin && v.periodo_checkout)
        ? `${fmtDate(v.periodo_checkin)} até ${fmtDate(v.periodo_checkout)}`
        : (solicitacaoOrigem && solicitacaoOrigem.periodo_checkin && solicitacaoOrigem.periodo_checkout
            ? `${fmtDate(solicitacaoOrigem.periodo_checkin)} até ${fmtDate(solicitacaoOrigem.periodo_checkout)}`
            : null);

      // Dados de Emissão / Minuta
      const quemGerou = v.pos_venda_nome || 'Equipe de Pós Venda';
      const quandoGerou = v.created_at;

      // Dados de Assinatura
      const quemAssinou = v.admin_assinante_nome || 'Administrador Geral';
      const quandoAssinou = v.assinado_em;

      document.getElementById('root').innerHTML = `
        <!-- Barra de ações -->
        <div class="actions-bar no-print">
          ${isCancelado ? `
          <span class="badge-status" style="background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;font-weight:bold;">
            🚫 VOUCHER CANCELADO
          </span>` : (isMinuta ? `
          <span class="badge-status" style="background:#fef3c7;color:#b45309;">
            ✍️ Minuta — Aguardando Assinatura do Administrador
          </span>` : (isUsadoTotal ? `
          <span class="badge-status" style="background:#e2e8f0;color:#334155;border:1px solid #cbd5e1;font-weight:bold;">
            ✓ Voucher Utilizado / Diárias Baixadas
          </span>` : (isVencido ? `
          <span class="badge-status" style="background:#fee2e2;color:#991b1b;font-weight:bold;">
            ⚠️ VOUCHER VENCIDO (EXPIRADO EM ${fmtDate(v.validade)})
          </span>` : `
          <span class="badge-status badge-ok">
            ✓ Disponível para Reserva
          </span>`)))}
          <button class="btn-print" onclick="window.print()">
            🖨️ Imprimir
          </button>
        </div>

        <!-- Documento Voucher -->
        <div class="voucher ${isCancelado ? 'is-cancelado' : (isUsadoTotal ? 'is-usado' : '')}" id="voucherDoc">
          <div class="v-usado-stamp">${isCancelado ? 'CANCELADO' : (isUsadoTotal ? 'UTILIZADO' : (isVencido ? 'EXPIRADO' : ''))}</div>
          ${isCancelado ? `
          <div style="background:#fee2e2;color:#991b1b;padding:9px 14px;font-weight:bold;text-align:center;font-size:12px;border-bottom:2px dashed #ef4444;line-height:1.45;">
            🚫 VOUCHER CANCELADO — ESTE DOCUMENTO FOI OFICIALMENTE CANCELADO E NÃO TEM VALIDADE PARA HOSPEDAGEM.
            ${dadosCancelamento ? `<br><span style="font-size:11px;font-weight:normal;color:#7f1d1d;">Motivo: <strong>${escHtml(dadosCancelamento.motivo)}</strong> | Registrado por: ${escHtml(dadosCancelamento.por)} (${fmtDateTime(dadosCancelamento.data)})</span>` : ''}
          </div>` : ''}
          ${isMinuta ? `
          <div style="background:#fffbeb;color:#92400e;padding:7px 12px;font-weight:bold;text-align:center;font-size:11px;border-bottom:2px dashed #f59e0b;">
            ⚠️ MINUTA DE VOUCHER — AGUARDA ASSINATURA OFICIAL DO ADMINISTRADOR (SEM VALIDADE PARA CHECK-IN ANTES DA ASSINATURA)
          </div>` : ''}
          ${isVencido ? `
          <div style="background:#fee2e2;color:#991b1b;padding:7px 12px;font-weight:bold;text-align:center;font-size:11px;border-bottom:2px dashed #ef4444;">
            ⚠️ VOUCHER VENCIDO / EXPIRADO — A DATA LIMITE DE VALIDADE (${fmtDate(v.validade)}) FOI ULTRAPASSADA
          </div>` : ''}
          ${isUsadoTotal ? `
          <div style="background:#f1f5f9;color:#334155;padding:7px 12px;font-weight:bold;text-align:center;font-size:11px;border-bottom:2px solid #cbd5e1;">
            ✓ VOUCHER UTILIZADO — TODAS AS DIÁRIAS FORAM BAIXADAS COM SUCESSO
          </div>` : ''}

          <!-- Cabeçalho -->
          <div class="v-header">
            <div class="v-title">
              <h1>VOUCHER</h1>
              <h2>RSM EMPREENDIMENTO</h2>
            </div>

            <div class="v-numero-wrap">
              <div class="v-numero-label">NÚMERO</div>
              <canvas id="qrcode"></canvas>
              <div class="v-numero-val">${String(v.numero || v.codigo).padStart(4, '0')}</div>
            </div>
          </div>

          <!-- Dados Principais -->
          <div class="v-dados">
            <div class="v-row">
              <span class="v-label">SALA DE VENDA:</span>
              <span class="v-value">${escHtml(v.sala_venda || '—')}</span>
            </div>
            <div class="v-row">
              <span class="v-label">DATA EMISSÃO:</span>
              <span class="v-value">${fmtDateTime(quandoGerou)}</span>
            </div>
            <div class="v-row">
              <span class="v-label">CONVIDADOS:</span>
              <span class="v-value">${escHtml(v.nome_socio)}</span>
            </div>
            <div class="v-row">
              <span class="v-label">BRINDE:</span>
              <span class="v-value">${brinde}</span>
            </div>
            <div class="v-row">
              <span class="v-label">DIÁRIAS CONCEDIDAS:</span>
              <span class="v-value"><strong>${v.diarias_totais || v.diarias || 2} diária(s)</strong></span>
            </div>
            ${(v.diarias_usadas > 0) ? `
            <div class="v-row" style="color:#b91c1c;">
              <span class="v-label">DIÁRIAS UTILIZADAS:</span>
              <span class="v-value"><strong>${v.diarias_usadas} diária(s)</strong> (Restam: ${Math.max(0, (v.diarias_totais || v.diarias || 2) - v.diarias_usadas)})</span>
            </div>` : ''}
            ${v.valor_hospedagem ? `
            <div class="v-row">
              <span class="v-label">VALOR HOSP.:</span>
              <span class="v-value">${fmt(v.valor_hospedagem)}</span>
            </div>` : ''}
            ${(v.periodo_checkin && v.periodo_checkout) ? `
            <div class="v-row">
              <span class="v-label">PERÍODO HOSPEDAGEM:</span>
              <span class="v-value"><strong>${fmtDate(v.periodo_checkin)} até ${fmtDate(v.periodo_checkout)}</strong></span>
            </div>` : ''}
            ${v.validade ? `
            <div class="v-row" style="background:${isUsadoTotal ? '#f1f5f9' : (isVencido ? '#fee2e2' : '#f0fdf4')};padding:5px 8px;border-radius:4px;border:1px solid ${isUsadoTotal ? '#cbd5e1' : (isVencido ? '#fca5a5' : '#bbf7d0')};margin-top:6px;">
              <span class="v-label" style="color:${isUsadoTotal ? '#475569' : (isVencido ? '#991b1b' : '#166534')};font-weight:800;">DATA DE VENCIMENTO:</span>
              <span class="v-value" style="color:${isUsadoTotal ? '#475569' : (isVencido ? '#991b1b' : '#166534')};font-weight:800;">
                VÁLIDO ATÉ ${fmtDate(v.validade)} ${isUsadoTotal ? '✓ (UTILIZADO)' : (isVencido ? '⚠️ (EXPIRADO)' : '✓ (NO PRAZO)')}
              </span>
            </div>` : ''}
          </div>

          <!-- Especificação -->
          <div class="v-espec-title">ESPECIFICAÇÃO DO VOUCHER :</div>
          <div class="v-espec-texto">${espec}</div>

          ${(v.observacoes && !v.observacoes.startsWith('Voucher de ') && v.observacoes.trim()) ? `
          <div style="background:#fffbeb;border:1px solid #f59e0b;border-left:4px solid #d97706;border-radius:4px;padding:7px 12px;margin:8px 14px 10px;font-size:10px;line-height:1.45;color:#78350f;">
            <strong style="text-transform:uppercase;letter-spacing:0.04em;display:block;margin-bottom:2px;color:#92400e;">📝 Observações do Voucher:</strong>
            ${escHtml(v.observacoes)}
          </div>
          ` : ''}

          <!-- Especificações de uso -->
          <div class="v-uso-title">ESPECIFICAÇÕES DE USO :</div>
          <div class="v-uso-lista">
            ${renderEspecUso(v.especificacoes_uso)}
          </div>

          <!-- Rodapé de Assinatura -->
          <div class="v-footer">
            <div class="v-assinatura">
              ${isAssinado ? `
                <div class="v-assinatura-linha">
                  ${assinaturaUrl ? `<img src="${assinaturaUrl}" class="v-assinatura-img" alt="Assinatura Oficial" />` : '<div style="font-size:11px;font-weight:800;color:#0f766e;">ASSINADO DIGITALMENTE</div>'}
                </div>
                <div class="v-assinatura-cargo">${quemAssinou ? `ADMIN / GERENTE (${escHtml(quemAssinou).toUpperCase()})` : 'GERENTE GERAL'}</div>
                <div style="font-size:7.5px;color:#15803d;margin-top:2px;font-weight:700;">✓ Assinado oficialmente em ${fmtDateTime(quandoAssinou)}</div>
              ` : `
                <div class="v-assinatura-linha" style="border-bottom: 2px dashed #d97706; min-height: 44px; display: flex; align-items: center; justify-content: center; background: #fffbeb; border-radius: 4px; padding: 3px 6px;">
                  <span style="font-size: 9.5px; color: #b45309; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; text-align: center;">
                    ⏳ MINUTA — AGUARDA ASSINATURA ADMIN
                  </span>
                </div>
                <div class="v-assinatura-cargo" style="color: #b45309;">GERENTE / ADMINISTRADOR (NÃO ASSINADO)</div>
                <div style="font-size: 7.5px; color: #dc2626; margin-top: 2px; font-weight: 600;">⚠️ Sem validade para reserva até assinatura oficial</div>
              `}
            </div>
            <div class="v-data-impressao">
              <div>DATA IMPRESSÃO: ${agora}</div>
            </div>
          </div>
        </div>`;

      // Gera QR Code
      QRCode.toCanvas(document.getElementById('qrcode'), linkAtual, {
        width: 80, margin: 1,
        color: { dark: '#000', light: '#fff' }
      });
    }

    // ── Helper número por extenso (simplificado) ─────────────
    function numPorExtenso(n) {
      const ext = ['','um','duas','três','quatro','cinco','seis','sete','oito','nove','dez'];
      return n <= 10 ? ext[n] : n;
    }

    carregarVoucher();
  </script>
</body>
</html>
